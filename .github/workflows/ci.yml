# Human-owned code checks. The scheduled agent mounts the default branch, so a
# regression in the normalizer or the register lint reaches production on the
# next run — this gate is what stands between a merge and that run.
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint register
        run: python scripts/validate_register.py
      - name: Unit tests
        run: python -m unittest discover -v tests
      - name: Ruff (lint + format)
        if: matrix.python-version == '3.13'
        run: |
          ruff check scripts tests
          ruff format --check scripts tests
      - name: Mypy
        if: matrix.python-version == '3.13'
        run: mypy scripts tests
